name: Code Coverage

on:
  push:
    # branches to consider in the event; optional, defaults to all
    branches:
      - main
  workflow_dispatch:

jobs:  
  codecoverage:
    name: "Code Coverage"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2.3.4

    - name: Restore Nuget Packages
      run: dotnet restore EstateManagementUI.sln --source ${{ secrets.PUBLICFEEDURL }} --source ${{ secrets.PRIVATEFEED_URL }}

    - name: Build Code
      run: dotnet build EstateManagementUI.sln --configuration Release

    - name: Run Unit Tests
      run: |
        echo "ASPNETCORE_ENVIRONMENT are > ${ASPNETCORE_ENVIRONMENT}"
        dotnet test EstateManagementUI.BlazorServer.Tests/EstateManagementUI.BlazorServer.Tests.csproj --configuration Release --no-build --coverlet --coverlet-output-format cobertura --maxcpucount:1

    - name: Normalize coverage filename
      run: |
        coverage_file=$(find TestResults -name 'coverage.cobertura.*.xml' -print -quit)
        if [ -z "$coverage_file" ]; then
          echo "Coverage report not found"
          exit 1
        fi
        mv "$coverage_file" EstateManagementUI.BlazorServer.Tests/coverage.cobertura.xml

    - name: Upload merged coverage to Codacy
      uses: codacy/codacy-coverage-reporter-action@v1
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: ./EstateManagementUI.BlazorServer.Tests/coverage.cobertura.xml
